<title>Օֆիս 96</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700;800&display=swap">
<style>
  /* Օֆիս 96 — Discord-ոճ դասավորություն, Escort Gaming-ի գիշերային շեշտերով։
     Միտումնավոր մեկ (մուգ) թեմա — օֆիսը գիշերային ա։ */
  :root {
    --bg-deep:#1e1f22; --bg-side:#2b2d31; --bg-main:#313338; --bg-hover:#2e3035;
    --bg-active:#404249; --bg-input:#383a40; --bg-user:#232428;
    --line:#26272b; --line2:#3f4147;
    --text:#dbdee1; --head:#f2f3f5; --muted:#949ba4; --muted2:#80848e;
    --brand:#ffd27a; --green:#23a559; --red:#f23f43;
    --founder:#f0b232; --lead:#3dd68c; --math:#7aa5f5; --developer:#b57edc; --qa:#eb6e9c;
    --mono:ui-monospace, Menlo, Consolas, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg-main); color:var(--text);
    font-family:"Noto Sans Armenian","Segoe UI",system-ui,sans-serif; font-size:15px;
    display:flex; height:100dvh; overflow:hidden; }
  button { font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; }
  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background:var(--bg-deep); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* ---- ձախ սյուն ---- */
  #side { width:236px; flex:none; background:var(--bg-side); display:flex; flex-direction:column; }
  #server { height:48px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px;
    border-bottom:1px solid var(--bg-deep); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  #server b { font-size:14px; font-weight:800; letter-spacing:.04em; color:var(--brand); }
  #conn { margin-left:auto; width:9px; height:9px; border-radius:50%; background:var(--muted2); }
  #conn.on { background:var(--green); box-shadow:0 0 5px var(--green); }
  #chlist { flex:1; overflow-y:auto; padding:12px 8px; }
  .cat { font:700 11px "Noto Sans Armenian",sans-serif; letter-spacing:.05em; text-transform:uppercase;
    color:var(--muted2); padding:10px 8px 4px; }
  .ch { display:flex; align-items:center; gap:7px; width:100%; padding:7px 8px; border-radius:6px;
    color:var(--muted); font-size:15px; font-weight:500; margin:1px 0; text-align:left; }
  .ch:hover { background:var(--bg-hover); color:var(--text); }
  .ch.cur { background:var(--bg-active); color:var(--head); }
  .ch .h { font-weight:600; color:var(--muted2); width:16px; text-align:center; flex:none; }
  .ch .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ch .badge { flex:none; min-width:17px; height:17px; padding:0 5px; border-radius:9px;
    background:var(--red); color:#fff; font:800 10.5px/17px var(--mono); text-align:center; }
  .ch .badge:empty { display:none; }
  #userbar { flex:none; background:var(--bg-user); padding:8px 10px; display:flex; align-items:center; gap:9px; }
  #userbar .av { width:34px; height:34px; border-radius:50%; flex:none; }
  #userbar .meta { flex:1; min-width:0; }
  #userbar .meta b { display:block; font-size:13.5px; color:var(--head); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #userbar .meta span { font-size:11px; color:var(--muted2); }
  #userbar input { width:100%; background:var(--bg-deep); border:1px solid var(--line2); border-radius:5px;
    color:var(--head); font:600 13px "Noto Sans Armenian",sans-serif; padding:4px 7px; }
  #userbar input:focus { outline:none; border-color:var(--brand); }
  #editName { color:var(--muted); padding:6px; border-radius:5px; }
  #editName:hover { background:var(--bg-hover); color:var(--text); }

  /* ---- գլխավոր ---- */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #chead { height:48px; flex:none; display:flex; align-items:center; gap:9px; padding:0 16px;
    border-bottom:1px solid var(--bg-deep); box-shadow:0 1px 0 rgba(0,0,0,.1); }
  #burger { display:none; font-size:19px; color:var(--muted); padding:4px 8px 4px 0; }
  #chead .h { font-size:20px; font-weight:600; color:var(--muted2); }
  #chead b { font-size:16px; font-weight:700; color:var(--head); }
  #chead .sep { width:1px; height:22px; background:var(--line2); margin:0 3px; }
  #topic { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #err { display:none; background:rgba(242,63,67,.14); border:1px solid rgba(242,63,67,.4);
    color:#ffb3b5; border-radius:8px; padding:8px 12px; font-size:12.5px; margin:10px 16px 0; }

  #msgs { flex:1; overflow-y:auto; padding:16px 0 24px; }
  .day { display:flex; align-items:center; gap:10px; margin:18px 16px 6px; }
  .day::before, .day::after { content:""; flex:1; height:1px; background:var(--line2); }
  .day span { font:700 11px var(--mono); letter-spacing:.08em; color:var(--muted2); }
  .m { display:flex; gap:14px; padding:2px 16px; }
  .m.first { margin-top:14px; padding-top:3px; }
  .m:hover { background:var(--bg-hover); }
  .m .av { width:40px; height:40px; border-radius:50%; flex:none; margin-top:2px; }
  .m .avgap { width:40px; flex:none; }
  .m .body { flex:1; min-width:0; }
  .mh { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .au { font-size:15px; font-weight:700; color:var(--head); }
  .au.founder { color:var(--founder); } .au.lead { color:var(--lead); }
  .au.math { color:var(--math); } .au.developer { color:var(--developer); } .au.qa { color:var(--qa); }
  .ts { font-size:11px; color:var(--muted2); }
  .new { font:800 9px var(--mono); letter-spacing:.06em; color:#3a2600; background:var(--brand);
    border-radius:4px; padding:1px 5px; }
  .tx { white-space:pre-wrap; overflow-wrap:break-word; line-height:1.45; font-size:14.5px;
    color:var(--text); max-width:78ch; }
  .tx a { color:#00a8fc; text-decoration:none; }
  .tx a:hover { text-decoration:underline; }
  .tx.jumbo { font-size:44px; line-height:1.2; }
  .empty { color:var(--muted); font-size:13.5px; padding:8px 16px; }

  /* ---- ռեակցիաներ ---- */
  .m { position:relative; }
  .rxrow { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .rx { display:inline-flex; align-items:center; gap:5px; background:var(--bg-side);
    border:1px solid var(--line2); border-radius:9px; padding:2px 8px; font-size:13px; }
  .rx b { font:700 12px var(--mono); color:var(--muted); }
  .rx:hover { border-color:var(--muted2); }
  .rx.mine { border-color:var(--brand); background:rgba(255,210,122,.1); }
  .rx.mine b { color:var(--brand); }
  .rxadd { color:var(--muted2); font-size:14px; padding:2px 7px; border:1px dashed var(--line2);
    border-radius:9px; opacity:0; }
  .m:hover .rxadd, .rxrow:not(:empty) .rxadd { opacity:1; }
  @media (hover:none) { .rxadd { opacity:1; } }
  .rxadd:hover { color:var(--text); border-color:var(--muted2); }
  #picker { position:fixed; z-index:20; background:var(--bg-deep); border:1px solid var(--line2);
    border-radius:12px; padding:8px; display:none; gap:2px; box-shadow:0 8px 26px rgba(0,0,0,.5); }
  #picker.open { display:flex; }
  #picker button { font-size:21px; padding:6px 8px; border-radius:8px; }
  #picker button:hover { background:var(--bg-active); }

  #compose { flex:none; padding:0 16px calc(16px + env(safe-area-inset-bottom)); }
  #cbar { display:flex; align-items:flex-end; background:var(--bg-input); border-radius:10px; }
  #inp { flex:1; background:none; border:none; color:var(--text); resize:none;
    font:400 14.5px/1.45 "Noto Sans Armenian",sans-serif; padding:13px 8px 13px 16px;
    min-height:46px; max-height:160px; }
  #inp:focus { outline:none; }
  #inp::placeholder { color:var(--muted2); }
  #send { flex:none; padding:11px 14px; font-size:19px; color:var(--muted); border-radius:10px; }
  #send:hover { color:var(--brand); }
  #send:disabled { opacity:.35; }
  #note { font-size:10.5px; color:var(--muted2); line-height:1.5; padding:6px 4px 0; }

  /* ---- մոբայլ ---- */
  #shade { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:8; }
  @media (max-width:760px) {
    #side { position:fixed; left:0; top:0; bottom:0; z-index:9; transform:translateX(-104%);
      transition:transform .22s ease; box-shadow:4px 0 18px rgba(0,0,0,.4); }
    #side.open { transform:none; }
    #shade.open { display:block; }
    #burger { display:block; }
    #topic { display:none; }
  }
</style>

<div id="side">
  <div id="server"><b>ESCORT GAMING</b><span id="conn" title="կապ"></span></div>
  <div id="chlist"></div>
  <div id="userbar">
    <img class="av" id="myAv" alt="">
    <div class="meta"><b id="myName"></b><span>օնլայն դուռ</span></div>
    <button id="editName" title="Փոխել անունը">✎</button>
  </div>
</div>
<div id="shade"></div>
<div id="main">
  <div id="chead">
    <button id="burger">☰</button>
    <span class="h" id="chIcon">#</span><b id="chName"></b>
    <span class="sep"></span><span id="topic"></span>
  </div>
  <div id="err"></div>
  <div id="msgs"></div>
  <div id="compose">
    <div id="cbar">
      <textarea id="inp" rows="1"></textarea>
      <button id="send" title="Ուղարկել (Ctrl+Enter)">➤</button>
    </div>
    <div id="note">Գրածդ պահվում ա օֆիսի բազայում. Սևակը հերթական արթնացմանը կարդում ա ու մտցնում git արխիվ։ Չաթը append-only ա — գրվածը մնում ա։</div>
  </div>
</div>
<div id="picker"></div>

<script>
"use strict";
const CHANNELS = [
  { id:"general",  label:"general",  icon:"#",  cat:"Քանալներ", topic:"Ընդհանուր — բոլորը + Aram" },
  { id:"dev",      label:"dev",      icon:"#",  cat:"Քանալներ", topic:"Տեխնիկական — ղեկավար, developer, QA" },
  { id:"product",  label:"product",  icon:"#",  cat:"Քանալներ", topic:"Պրոդուկտ ու դիզայն — ղեկավար + Aram" },
  { id:"club96",   label:"club96",   icon:"#",  cat:"Քանալներ", topic:"Ազատ գոտի. երգեր, մեմեր, գիշերվա մտքեր" },
  { id:"dm-sevak", label:"Սևակ",     icon:"🔒", cat:"Անձնական", topic:"Aram ↔ Սևակ" },
  { id:"dm-tigran",label:"Տիգրան",   icon:"🔒", cat:"Անձնական", topic:"Aram ↔ Տիգրան" },
  { id:"dm-anania",label:"Անանիա",   icon:"🔒", cat:"Անձնական", topic:"Aram ↔ Անանիա" },
  { id:"dm-lusine",label:"Լուսինե",  icon:"🔒", cat:"Անձնական", topic:"Aram ↔ Լուսինե" },
  { id:"decisions",label:"decisions",icon:"📜", cat:"Արխիվ",    topic:"Միայն վավերացված որոշումներ" },
];
const ARCHIVE = __ARCHIVE_JSON__;
const AVATARS = __AVATARS_JSON__;

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const roleOf = (a) => a.includes("Aram") ? "founder" : (a.match(/\(([^)]+)\)/) || [,""])[1].trim().split(",")[0].trim();

/* SVG շրջանակ-ավատար նրանց, ում նկարը չկա (Aram-ի ոսկե «A»-ն ներառյալ) */
function fallbackAv(author) {
  const role = roleOf(author) || "x";
  const colors = { founder:"#f0b232", lead:"#3dd68c", math:"#7aa5f5", developer:"#b57edc", qa:"#eb6e9c", x:"#5c6069" };
  const c = colors[role] || colors.x;
  const ch = (author.trim()[0] || "?").toUpperCase();
  return "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><circle cx="48" cy="48" r="48" fill="${c}"/>` +
    `<text x="48" y="63" font-family="Arial" font-size="44" font-weight="700" fill="#1e1f22" text-anchor="middle">${ch}</text></svg>`);
}
function avatarOf(author) {
  for (const k in AVATARS) if (author.startsWith(k)) return AVATARS[k];
  return fallbackAv(author);
}

let cur = "general";
const live = {}, unread = {}, rx = {};
const REACT_SET = ["❤️","😂","👍","🔥","👏","😮","🎉","💪"];
let dbRef = null;
const isJumbo = (t) => t.length <= 16 && /^[\p{Extended_Pictographic}\p{Emoji_Component}‍️\s]+$/u.test(t);

const fmtT = (ts) => ts.slice(11, 16);
const dayOf = (ts) => ts.slice(0, 10);

/* ---- ձախ սյուն ---- */
function renderSide() {
  let html = "", lastCat = "";
  for (const c of CHANNELS) {
    if (c.cat !== lastCat) { html += `<div class="cat">${c.cat}</div>`; lastCat = c.cat; }
    html += `<button class="ch ${c.id === cur ? "cur" : ""}" data-c="${c.id}">` +
      `<span class="h">${c.icon}</span><span class="nm">${c.label}</span>` +
      `<span class="badge">${unread[c.id] || ""}</span></button>`;
  }
  $("chlist").innerHTML = html;
  document.querySelectorAll(".ch").forEach(b => b.addEventListener("click", () => {
    cur = b.dataset.c; closeSide(); renderSide(); renderHead(); renderMsgs();
  }));
}
function renderHead() {
  const c = CHANNELS.find(x => x.id === cur);
  $("chIcon").textContent = c.icon; $("chName").textContent = c.label; $("topic").textContent = c.topic;
  $("inp").placeholder = "Գրի #" + c.label + "-ում…";
}

/* ---- հաղորդագրություններ ---- */
function allMsgs(ch) {
  const arc = (ARCHIVE[ch] || []).map(m => ({ ...m, src: "archive" }));
  const web = (live[ch] || []);
  const ids = new Set(arc.map(m => m.id));
  return arc.concat(web.filter(m => !ids.has(m.id))).sort((a, b) => a.ts < b.ts ? -1 : 1);
}
/* արխիվում ներդրված ռեակցիաներ + db-ի doc-ը → մեկ միասնական {emoji:[անուններ]} */
function mergedRx(m) {
  const out = {};
  for (const src of [m.reactions, (rx[cur] || {})[m.id]]) {
    if (!src) continue;
    for (const e in src) {
      if (!Array.isArray(src[e])) continue;
      out[e] = [...new Set([...(out[e] || []), ...src[e].map(String)])];
    }
  }
  return out;
}
function rxRowHtml(m) {
  const r = mergedRx(m);
  let chips = "";
  for (const e of Object.keys(r)) {
    if (!r[e].length) continue;
    const mine = r[e].some(n => n === myName || n.split(" ")[0] === myName.split(" ")[0]);
    chips += `<button class="rx ${mine ? "mine" : ""}" data-mid="${m.id}" data-e="${e}" title="${esc(r[e].join(", "))}">${e}<b>${r[e].length}</b></button>`;
  }
  return `<div class="rxrow">${chips}<button class="rxadd" data-mid="${m.id}" title="Ռեակցիա">☺+</button></div>`;
}
function renderMsgs() {
  const list = allMsgs(cur);
  let html = "", lastDay = "", prev = null;
  for (const m of list) {
    const d = dayOf(m.ts);
    if (d !== lastDay) { html += `<div class="day"><span>${d}</span></div>`; lastDay = d; prev = null; }
    const grouped = prev && prev.author === m.author &&
      (Date.parse(m.ts) - Date.parse(prev.ts)) < 7 * 60000 && prev.src === m.src;
    const role = roleOf(m.author);
    const tx = `<div class="tx ${isJumbo(m.text) ? "jumbo" : ""}">${linkify(m.text)}</div>`;
    if (grouped) {
      html += `<div class="m"><div class="avgap"></div><div class="body">${tx}${rxRowHtml(m)}</div></div>`;
    } else {
      html += `<div class="m first"><img class="av" src="${avatarOf(m.author)}" alt="" loading="lazy">` +
        `<div class="body"><div class="mh"><span class="au ${esc(role)}">${esc(m.author)}</span>` +
        `<span class="ts">${dayOf(m.ts)} · ${fmtT(m.ts)}</span>` +
        (m.src === "web" ? `<span class="new">ՆՈՐ</span>` : "") +
        `</div>${tx}${rxRowHtml(m)}</div></div>`;
    }
    prev = m;
  }
  if (!list.length) html = `<div class="empty">Դեռ գրառում չկա — առաջինը գրի։</div>`;
  const el = $("msgs");
  const stick = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = html;
  if (stick || !el.dataset.drawn) { el.scrollTop = el.scrollHeight; el.dataset.drawn = "1"; }
}

/* ---- ռեակցիա դնել/հանել ---- */
async function toggleReact(mid, emoji) {
  if (!dbRef) { sendErr("Կապը բազայի հետ չկա — ռեակցիան չպահվեց։"); return; }
  const m = allMsgs(cur).find(x => x.id === mid);
  if (!m) return;
  const merged = mergedRx(m);
  const names = merged[emoji] || [];
  const i = names.indexOf(myName);
  if (i >= 0) names.splice(i, 1); else names.push(myName);
  merged[emoji] = names;
  for (const e in merged) if (!merged[e].length) delete merged[e];
  try { await dbRef.doc("channels/" + cur + "/reactions/" + mid).set(merged); }
  catch (e) { sendErr("Ռեակցիան չպահվեց (" + (e && e.code || "սխալ") + ")։"); }
}
const picker = $("picker");
let pickerMid = null;
document.addEventListener("click", (ev) => {
  const add = ev.target.closest(".rxadd");
  const chip = ev.target.closest(".rx");
  if (add) {
    pickerMid = add.dataset.mid;
    picker.innerHTML = REACT_SET.map(e => `<button data-e="${e}">${e}</button>`).join("");
    picker.classList.add("open");
    const r = add.getBoundingClientRect(), pw = 8 * 41 + 16;
    picker.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.left)) + "px";
    picker.style.top = Math.max(8, r.top - 54) + "px";
    ev.stopPropagation(); return;
  }
  if (ev.target.closest("#picker button")) {
    toggleReact(pickerMid, ev.target.closest("#picker button").dataset.e);
    picker.classList.remove("open"); return;
  }
  if (chip) { toggleReact(chip.dataset.mid, chip.dataset.e); return; }
  picker.classList.remove("open");
});

function sendErr(msg) { const e = $("err"); e.textContent = msg; e.style.display = "block"; setTimeout(() => e.style.display = "none", 6000); }

/* ---- ինքնություն (սարքին կպած հարմարություն) ---- */
let myName = "Aram (founder)";
try { myName = localStorage.getItem("office96-name") || myName; } catch {}
function renderUser() { $("myName").textContent = myName; $("myAv").src = avatarOf(myName); }
$("editName").addEventListener("click", () => {
  const meta = document.querySelector("#userbar .meta");
  meta.innerHTML = `<input id="nameInp" maxlength="40" value="${esc(myName)}">`;
  const inp = $("nameInp"); inp.focus(); inp.select();
  const done = () => {
    myName = inp.value.trim() || "Aram (founder)";
    try { localStorage.setItem("office96-name", myName); } catch {}
    meta.innerHTML = `<b id="myName"></b><span>օնլայն դուռ</span>`; renderUser();
  };
  inp.addEventListener("blur", done);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
});

/* ---- մոբայլ drawer ---- */
const closeSide = () => { $("side").classList.remove("open"); $("shade").classList.remove("open"); };
$("burger").addEventListener("click", () => { $("side").classList.add("open"); $("shade").classList.add("open"); });
$("shade").addEventListener("click", closeSide);

/* ---- գրելը ---- */
const inp = $("inp");
inp.addEventListener("input", () => { inp.style.height = "auto"; inp.style.height = Math.min(160, inp.scrollHeight) + "px"; });
inp.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); });
$("send").addEventListener("click", send);
async function send() {
  const text = inp.value.trim();
  if (!text) return;
  if (!dbRef) { sendErr("Կապը բազայի հետ չկա — գրառումը չուղարկվեց։ Թարմացրու էջը։"); return; }
  $("send").disabled = true;
  try {
    const now = new Date();
    const ts = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 19);
    await dbRef.collection("channels/" + cur + "/messages").add({ author: myName, ts, text, src: "web" });
    inp.value = ""; inp.style.height = "auto";
  } catch (e) {
    sendErr(e && e.code === "quota_exceeded" ? "Բազան լցվել ա — ասա Սևակին, կմաքրի արխիվ տանելով։" : "Չստացվեց ուղարկել (" + (e && e.code || "սխալ") + ")։ Փորձի նորից։");
  }
  $("send").disabled = false;
}

/* ---- առաջին նկարումը (արխիվն աշխատում ա նույնիսկ առանց db) ---- */
renderSide(); renderHead(); renderMsgs(); renderUser();

/* ---- live db ---- */
(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) { $("conn").title = "օֆլայն — միայն արխիվ"; return; }
  dbRef = db;
  $("conn").classList.add("on"); $("conn").title = "live";
  for (const c of CHANNELS) {
    db.collection("channels/" + c.id + "/messages").orderBy("ts").limit(500).onSnapshot(snap => {
      live[c.id] = snap.docs.filter(d => d.exists).map(d => {
        const b = d.data() || {};
        return { id: d.id, author: String(b.author || "անանուն"), ts: String(b.ts || ""), text: String(b.text || ""), src: b.src === "synced" ? "archive" : "web" };
      });
      unread[c.id] = live[c.id].filter(m => m.src === "web").length;
      renderSide();
      if (c.id === cur) renderMsgs();
    }, err => { if (err && err.code === "revoked") { $("conn").classList.remove("on"); $("conn").title = "կապը կտրվեց"; } });
    db.collection("channels/" + c.id + "/reactions").onSnapshot(snap => {
      rx[c.id] = {};
      for (const d of snap.docs) if (d.exists) rx[c.id][d.id] = d.data() || {};
      if (c.id === cur) renderMsgs();
    }, () => {});
  }
})();
</script>
